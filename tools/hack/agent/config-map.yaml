        },
        {
            "name": "Persistent Queues Rate",
            "description": " Oracle AQ (Advanced Queue) 기반의 큐들에 대해, Snap 구간 동안 발생한 메시지 인큐/디큐 속도를 요약",
            "sql": ""
        },
        {
            "name": "Persistent Queue Subscribers",
            "description": "Advanced Queue (AQ) 기능을 사용하는 **큐와 구독자(Subscriber)**의 활동을 모니터링하는 영역으로\n메시지 기반 아키텍처나 이벤트 기반 프로세싱에서 활용",
            "sql": "-- 현재 세션이 구독 중인 채널 확인\nSELECT * FROM pg_listening_channels();\n"
        },
        {
            "name": "Shared Servers Activity",
            "description": "Shared Servers Activity 섹션에 대한 상세 분석",
            "sql": ""
        },
        {
            "name": "Shared Servers Rates",
            "description": "Shared Server 환경의 처리량(Throughput)을 초당 단위로 요약한 통계",
            "sql": ""
        },
        {
            "name": "Shared Servers Utilization",
            "description": "Shared Server 환경에서 서버 프로세스들이 얼마나 바쁘게 일하고 있는지, 그리고 네트워크 IO 비중은 어느 정도인지를 나타내는 지표",
            "sql": ""
        },
        {
            "name": "Shared Servers Dispatchers",
            "description": "hared Server 환경에서 Dispatcher 프로세스의 부하 상태와 큐 지연 상태를 보여주는 부분.\n이 정보를 통해 Dispatcher가 얼마나 바쁘고, 요청이 큐에서 얼마나 기다렸는지 등을 확인 가능",
            "sql": "-- 현재 연결된 세션 수 (대기포함)\nSELECT state, count(*) \nFROM pg_stat_activity \nGROUP BY state;\n\n-- postgres가 busy한 정도 확인\nSELECT\n  COUNT(*) FILTER (WHERE state = 'active') AS active_sessions,\n  COUNT(*) AS total_sessions,\n  ROUND(100.0 * COUNT(*) FILTER (WHERE state = 'active') / NULLIF(COUNT(*), 0), 2) AS active_pct\nFROM pg_stat_activity;\n\n"
        },
        {
            "name": "init.ora Parameters",
            "description": "인스턴스 초기화 파라미터(Init Parameters)의 현재 값을 보여주는 부분. 이 정보는 시스템 설정, 성능 조정, 문제 해결에 있어서 매우 중요",
            "sql": "SELECT name, setting, unit, context, source\nFROM pg_settings\nORDER BY name;\n"
        },
        {
            "name": "init.ora Multi-Valued Parameters",
            "description": "하나 이상의 값을 가지는 초기화 파라미터. 파라미터들은 주로 파일 경로나 디렉터리, 목록 형태로 사용되는 설정 항목",
            "sql": "SHOW config_file;\n"
        },
        {
            "name": "Wait Event Histogram",
            "description": "대기 이벤트의 지속 시간 분포를 파악",
            "sql": "WITH query_times AS (\n    SELECT \n        queryid,\n        substring(query, 1, 100) AS query_sample,\n        calls,\n        total_exec_time / 1000 AS total_exec_time_ms,\n        min_exec_time / 1000 AS min_exec_time_ms,\n        max_exec_time / 1000 AS max_exec_time_ms,\n        mean_exec_time / 1000 AS mean_exec_time_ms\n    FROM pg_stat_statements\n)\nSELECT \n    queryid,\n    query_sample,\n    calls,\n    ROUND(total_exec_time_ms::numeric, 1) AS total_exec_time_ms,\n    ROUND(min_exec_time_ms::numeric, 1) AS min_exec_time_ms,\n    ROUND(max_exec_time_ms::numeric, 1) AS max_exec_time_ms,\n    ROUND(mean_exec_time_ms::numeric, 1) AS avg_exec_time_ms,\n    -- 시간대별 분포를 백분율로 표시\n    ROUND(100.0 * (CASE WHEN mean_exec_time_ms \u003c 1 THEN 1 ELSE 0 END)::numeric, 1) AS \"% \u003c 1ms\",\n    ROUND(100.0 * (CASE WHEN mean_exec_time_ms \u003e= 1 AND mean_exec_time_ms \u003c 2 THEN 1 ELSE 0 END)::numeric, 1) AS \"% \u003c 2ms\",\n    ROUND(100.0 * (CASE WHEN mean_exec_time_ms \u003e= 2 AND mean_exec_time_ms \u003c 4 THEN 1 ELSE 0 END)::numeric, 1) AS \"% \u003c 4ms\",\n    ROUND(100.0 * (CASE WHEN mean_exec_time_ms \u003e= 4 AND mean_exec_time_ms \u003c 8 THEN 1 ELSE 0 END)::numeric, 1) AS \"% \u003c 8ms\",\n    ROUND(100.0 * (CASE WHEN mean_exec_time_ms \u003e= 8 AND mean_exec_time_ms \u003c 16 THEN 1 ELSE 0 END)::numeric, 1) AS \"% \u003c 16ms\",\n    ROUND(100.0 * (CASE WHEN mean_exec_time_ms \u003e= 16 AND mean_exec_time_ms \u003c 32 THEN 1 ELSE 0 END)::numeric, 1) AS \"% \u003c 32ms\",\n    ROUND(100.0 * (CASE WHEN mean_exec_time_ms \u003e= 32 AND mean_exec_time_ms \u003c 1000 THEN 1 ELSE 0 END)::numeric, 1) AS \"% \u003c 1s\",\n    ROUND(100.0 * (CASE WHEN mean_exec_time_ms \u003e= 1000 THEN 1 ELSE 0 END)::numeric, 1) AS \"% \u003e 1s\"\nFROM query_times\nORDER BY total_exec_time_ms DESC\nLIMIT 20;"
        },
        {
            "name": "Service Statistics",
            "description": "각 서비스 단위로 Database 자원 사용량을 분리해서 보여주는 중요한 부분",
            "sql": "-- DB별 자원 사용량 조회\nSELECT\n  datname AS database_name,\n  SUM(blks_read) * current_setting('block_size')::int / 1024 / 1024 AS physical_reads_mb,\n  SUM(blks_hit) * current_setting('block_size')::int / 1024 / 1024 AS logical_reads_mb,\n  SUM(xact_commit + xact_rollback) AS total_txn,\n  ROUND(SUM(blk_read_time + blk_write_time)::numeric / 1000, 2) AS io_time_sec\nFROM pg_stat_database\nGROUP BY datname\nORDER BY io_time_sec DESC;"
        },
        {
            "name": "Service Wait Class Stats",
            "description": "서비스 단위로 Wait Class 별 대기 횟수 및 대기 시간",
            "sql": "-- pg_stat_activity기반 현재 대기조회\nSELECT \n  application_name,\n  wait_event_type,\n  wait_event,\n  COUNT(*) AS total_waits\nFROM pg_stat_activity\nWHERE state = 'active' AND wait_event IS NOT NULL\nGROUP BY application_name, wait_event_type, wait_event\nORDER BY total_waits DESC;\n\n'--  pg_wait_sampling을 이용한 wait time 추적\nSELECT\n  event_type,\n  event,\n  COUNT(*) AS wait_count\nFROM pg_wait_sampling_history\nGROUP BY event_type, event\nORDER BY wait_count DESC;"
        },
        {
            "name": "SQL ordered by\nElapsed Time",
            "description": "스냅샷 기간 내에 쿼리 누적 \n실행시간  내림차순 SQL 통계",
            "sql": "SELECT\n    queryid AS sql_id,\n    substring(query, 1, 100) AS sql_text, \n    calls AS executions, \n    total_exec_time / 1000 AS elapsed_time_seconds,  \n    (total_exec_time / calls) / 1000 AS elapsed_per_exec, \n    100 * (total_exec_time / SUM(total_exec_time) OVER ()) AS pct_total,  \n    100 * (blk_read_time + blk_write_time) / NULLIF(total_exec_time, 0) AS pct_io, \n    100 * (total_exec_time - blk_read_time - blk_write_time) / NULLIF(total_exec_time, 0) AS pct_cpu \nFROM pg_stat_statements\nORDER BY total_exec_time DESC\nLIMIT 20;"
        },
        {
            "name": "SQL ordered by\nUser I/O Wait Time\n\n(User I/O =\u003e 세션,\n세션 대기시간 내림차순 SQL 통계 )",
            "description": "스냅샷 기간 내에 세션 대기 시간\n내림차순 통계",
            "sql": "WITH total_io AS (\n    SELECT SUM(blk_read_time + blk_write_time) AS total_io_time\n    FROM pg_stat_statements\n    WHERE blk_read_time + blk_write_time \u003e 0\n)\nSELECT\n    queryid AS \"SQL ID\",\n    ROUND((blk_read_time + blk_write_time)::numeric / 1000, 2) AS \"User I/O Time (s)\",\n    calls AS \"Executions\",\n    CASE \n        WHEN calls \u003e 0 THEN ROUND(((blk_read_time + blk_write_time) / calls)::numeric / 1000, 6)\n        ELSE 0 \n    END AS \"UIO per Exec (s)\",\n    ROUND(((blk_read_time + blk_write_time) * 100.0 / NULLIF(t.total_io_time, 0))::numeric, 2) AS \"%Total\",\n    ROUND((total_time / 1000)::numeric, 2) AS \"Elapsed Time (s)\",\n    ROUND(((total_time - (blk_read_time + blk_write_time)) * 100.0 / NULLIF(total_time, 0))::numeric, 2) AS \"%CPU\",\n    ROUND(((blk_read_time + blk_write_time) * 100.0 / NULLIF(total_time, 0))::numeric, 2) AS \"%IO\",\n    LEFT(COALESCE(application_name, ''), 30) AS \"SQL Module\",\n    LEFT(query, 1000) AS \"SQL Text\"\nFROM \n    pg_stat_statements\n    CROSS JOIN total_io t\nWHERE \n    blk_read_time + blk_write_time \u003e 0\nORDER BY \n    \"User I/O Time (s)\" DESC\nLIMIT 100;"
        },
        {
            "name": "SQL ordered by Gets\n\nTotal Buffer Gets : 쿼리가 실행될때 메모리에서 읽은(DB 버퍼 캐시) I/O 횟수,\nsession logical reads칼럼 참조함 \n",
            "description": "스냅샷 기간 내에 메모리에서 \n읽은 I/O \n횟수 기준 내림차순 통계 ",
            "sql": "WITH total_stats AS (\n    SELECT\n        SUM(shared_blks_hit + local_blks_hit) AS total_buffer_gets\n    FROM\n        pg_stat_statements\n    WHERE\n        shared_blks_hit + local_blks_hit \u003e 0\n)\nSELECT\n    s.shared_blks_hit + s.local_blks_hit AS \"Buffer Gets\",\n    s.calls AS \"Executions\",\n    ROUND((s.shared_blks_hit + s.local_blks_hit)::numeric / NULLIF(s.calls, 0), 2) AS \"Gets Per Exec\",\n    ROUND(((s.shared_blks_hit + s.local_blks_hit)::numeric / NULLIF(t.total_buffer_gets, 0)) * 100, 2) AS \"%Total\",\n    ROUND((s.total_exec_time / 1000)::numeric, 2) AS \"Elapsed Time (s)\",\n    ROUND(((s.total_exec_time - (s.blk_read_time + s.blk_write_time)) / NULLIF(s.total_exec_time, 0))::numeric * 100, 2) AS \"%CPU\",\n    ROUND(((s.blk_read_time + s.blk_write_time) / NULLIF(s.total_exec_time, 0))::numeric * 100, 2) AS \"%IO\",\n    s.queryid AS \"SQL ID\",\n    COALESCE(\n        (SELECT application_name \n         FROM pg_stat_activity \n         WHERE pg_stat_activity.query = s.query \n         LIMIT 1),\n        'N/A'\n    ) AS \"SQL Module\",\n    s.query AS \"SQL Text\"\nFROM\n    pg_stat_statements s\n    CROSS JOIN total_stats t\nWHERE\n    s.shared_blks_hit + s.local_blks_hit \u003e 0\nORDER BY\n    (s.shared_blks_hit + s.local_blks_hit) DESC\nLIMIT 100;\n\n"
        },
        {
            "name": "SQL ordered by Reads",
            "description": "스냅샷 구간 중 수행된 SQL을\n 디스크\n I/O발생량 순으로 내림차순 정렬",
            "sql": "SELECT\n    s.queryid AS \"SQL id\",\n    COALESCE(\n        SUBSTRING(\n            s.query FROM 1 FOR 50\n        ) || CASE WHEN LENGTH(s.query) \u003e 50 THEN '...' ELSE '' END,\n        'N/A'\n    ) AS \"SQL Text\",\n    COALESCE(a.application_name, 'N/A') AS \"SQL Module\",\n    s.shared_blks_hit + s.shared_blks_read + s.shared_blks_written AS \"Physical I/O Requests\",\n    s.calls AS \"Executions\",\n    CASE \n        WHEN s.calls \u003e 0 THEN ROUND(\n            (s.shared_blks_hit + s.shared_blks_read + s.shared_blks_written)::numeric / s.calls::numeric, \n            2\n        )\n        ELSE 0 \n    END AS \"I/O Requests per Exec\",\n    ROUND(\n        ((s.shared_blks_read + s.shared_blks_written)::numeric * 100.0) / \n        NULLIF((SELECT SUM(shared_blks_read + shared_blks_written)::numeric FROM pg_stat_statements), 0::numeric),\n        2\n    ) AS \"%Total\",\n    (s.total_exec_time / 1000)::numeric AS \"Elapsed Time (s)\",\n    ROUND(\n        ((s.total_exec_time - (s.blk_read_time + s.blk_write_time))::numeric * 100.0) / \n        NULLIF(s.total_exec_time::numeric, 0::numeric),\n        2\n    ) AS \"%CPU\",\n    ROUND(\n        ((s.blk_read_time + s.blk_write_time)::numeric * 100.0) / \n        NULLIF(s.total_exec_time::numeric, 0::numeric),\n        2\n    ) AS \"%IO\",\n    s.query AS \"Full SQL Text\"\nFROM \n    pg_stat_statements s\nLEFT JOIN \n    pg_stat_activity a ON s.userid = a.usesysid\nWHERE \n    (s.shared_blks_read + s.shared_blks_written) \u003e 0\n    AND s.query NOT LIKE '%pg_stat_statements%'  -- 이 쿼리 자체는 제외\nORDER BY \n    (s.shared_blks_read + s.shared_blks_written) DESC\nLIMIT 20;\n\n"
        },
        {
            "name": "SQL ordered by\n Physical Reads \n(UnOptimized)\n\n",
            "description": "Physical이 붙으면 I/O단위!\n\n최적화 되지않은 요청 계산 \nUnOptimized Read Reqs = Physical Read Requests - Optimized Read Requests",
            "sql": "SELECT\n    s.calls AS \"Executions\",\n    s.shared_blks_read AS \"Physical Read Reqs\",\n    s.shared_blks_read AS \"UnOptimized Read Reqs\",\n    ROUND(s.shared_blks_read::numeric / NULLIF(s.calls, 0), 2) AS \"UnOptimized Read Reqs per Exec\",\n    ROUND(0.0, 2) AS \"%Opt\",\n    ROUND(s.shared_blks_read * 100.0 / SUM(s.shared_blks_read) OVER (), 2) AS \"%Total\",\n    a.application_name AS \"SQL Module\",\n    s.query AS \"SQL Text\"\nFROM\n    pg_stat_statements s\nLEFT JOIN\n    pg_stat_activity a ON s.userid = a.usesysid\nWHERE\n    s.shared_blks_read \u003e 0\nORDER BY\n    s.shared_blks_read DESC\nLIMIT 100;"
        },
        {
            "name": "SQL ordered by\nExecutions",
            "description": "스냅샷 기간 내 쿼리 실행횟수 기준\n내림차순 정렬 ",
            "sql": "SELECT \n    calls AS \"Executions\",\n    rows AS \"Row Processed\",\n    ROUND(rows::numeric / NULLIF(calls, 0), 2) AS \"Rows per Exec\",\n    ROUND((mean_exec_time * calls / 1000.0)::numeric, 2) AS \"Elapsed Time (s)\",\n    ROUND(0.0::numeric, 2) AS \"%CPU\",\n    ROUND(0.0::numeric, 2) AS \"%IO\",\n    queryid::text AS \"SQL ID\",\n    substr(query, 1, 100) AS \"SQL Module\",\n    query AS \"SQL Text\"\nFROM \n    pg_stat_statements\nWHERE \n    calls \u003e 0\nORDER BY \n    calls DESC\nLIMIT 100;"
        },
        {
            "name": "SQL ordered by\nParse Calls",
            "description": "Parse Call을 발생시킨 쿼리를\nCall횟수기준 내림차순 정렬",
            "sql": "SELECT \n    queryid::text AS sql_id,\n    query,\n    calls,\n    total_exec_time,\n    ROUND(calls * 100.0 / (SUM(calls) OVER ()), 2) AS percent_total_calls,\n    rows,\n    mean_exec_time,\n    max_exec_time,\n    shared_blks_hit,\n    shared_blks_read\nFROM \n    pg_stat_statements\nWHERE \n    calls \u003e 0\nORDER BY \n    calls DESC\nLIMIT 20;\n\n"
        },
        {
            "name": "SQL ordered by\nsharable Memory",
            "description": "공유 메모리 사용량이 많은 \nSQL문 내림차순 정렬",
            "sql": "SELECT \n    queryid::text AS sql_id,\n    calls AS executions_total,\n    total_exec_time,\n    ROUND(calls * 100.0 / (SUM(calls) OVER ()), 2) AS percent_total_calls,\n    COALESCE(substr(query, 1, 200), 'N/A') AS query_text\nFROM \n    pg_stat_statements\nWHERE \n    calls \u003e 0\nORDER BY \n    calls DESC\nLIMIT 20;\n\n"
        },
        {
            "name": "SQL ordered by\nVersion Count",
            "description": "재사용 되지 않은 쿼리 \n통계",
            "sql": "SELECT\n    queryid::text AS sql_id,\n    COUNT(*) AS version_count,\n    SUM(calls) AS total_executions,\n    ROUND(COUNT(*) * 100.0 / (SELECT COUNT(*) FROM pg_stat_statements), 2) AS percent_total_versions\nFROM\n    pg_stat_statements\nGROUP BY\n    queryid, query\nORDER BY\n    version_count DESC\nLIMIT 20;\n\n"
        },
        {
            "name": "Complete List of\nSQL Text",
            "description": "스냅샷 기간내에 실행된 SQL문\n전체 테이블 ",
            "sql": "SELECT \n    pid, \n    datname, \n    usename, \n    state, \n    query, \n    query_start,\n    now() - query_start AS query_duration\nFROM pg_stat_activity\nWHERE query != '\u003cIDLE\u003e' AND query NOT LIKE 'autovacuum%'\nORDER BY query_start DESC\nLIMIT 100;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "데이터베이스 연결 및 활동 통계\n",
            "sql": "SELECT\n    datname AS database_name,\n    numbackends AS active_connections,\n    xact_commit AS committed_transactions,\n    xact_rollback AS rolled_back_transactions,\n    blks_read AS disk_blocks_read,\n    blks_hit AS buffer_hits,\n    tup_returned AS rows_returned,\n    tup_fetched AS rows_fetched,\n    tup_inserted AS rows_inserted,\n    tup_updated AS rows_updated,\n    tup_deleted AS rows_deleted,\n    conflicts AS conflicts,\n    temp_files AS temp_files_created,\n    temp_bytes AS temp_bytes_written,\n    deadlocks AS deadlocks,\n    checksum_failures AS checksum_failures,\n    checksum_last_failure AS last_checksum_failure_time,\n    blk_read_time AS time_spent_reading,\n    blk_write_time AS time_spent_writing\nFROM pg_stat_database\nWHERE datname IS NOT NULL;\n"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "버퍼 캐시 통계 ",
            "sql": "SELECT\n    buffers_checkpoint AS buffers_written_during_checkpoint,\n    buffers_clean AS buffers_written_by_bgwriter,\n    buffers_backend AS buffers_written_by_backends,\n    buffers_backend_fsync AS backend_fsync_calls,\n    buffers_alloc AS buffers_allocated,\n    checkpoint_write_time AS ms_spent_writing_checkpoints,\n    checkpoint_sync_time AS ms_spent_syncing_checkpoints,\n    checkpoints_timed AS scheduled_checkpoints,\n    checkpoints_req AS requested_checkpoints,\n    stats_reset AS statistics_reset_time\nFROM pg_stat_bgwriter;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "WAL 생성 통계",
            "sql": "SELECT\n    file_name,\n    file_offset,\n    pg_size_pretty(pg_current_wal_lsn() - '0/0'::pg_lsn) AS total_wal_volume,\n    pg_walfile_name(pg_current_wal_lsn()) AS current_wal_file,\n    pg_walfile_name_offset(pg_current_wal_lsn()) AS current_wal_file_offset,\n    pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), pg_last_wal_receive_lsn())) AS receive_lag,\n    pg_size_pretty(pg_wal_lsn_diff(pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn())) AS replay_lag\nFROM pg_current_wal_insert_lsn() AS file_offset,\n     pg_walfile_name(pg_current_wal_insert_lsn()) AS file_name;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "Lock, Deadlock\n 현황 통계",
            "sql": "SELECT \n    pid,\n    locktype,\n    relation::regclass AS locked_relation,\n    mode,\n    granted,\n    waitstart,\n    now() - waitstart AS wait_duration\nFROM pg_locks\nJOIN pg_stat_activity USING (pid)\nWHERE NOT granted;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "Replication\n Activity현황 통계",
            "sql": "SELECT \n    pid,\n    client_addr,\n    state,\n    sent_lsn,\n    write_lsn,\n    flush_lsn,\n    replay_lsn,\n    pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), sent_lsn)) AS replication_lag\nFROM pg_stat_replication;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "Session \u0026\n Connection",
            "sql": "SELECT \n    state,\n    count(*) AS count\nFROM pg_stat_activity\nGROUP BY state;\n\nSELECT \n    datname,\n    count(*) AS connections\nFROM pg_stat_activity\nGROUP BY datname;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "Parallel \u0026 Background Worker\n (병렬 처리/워크 프로세스)",
            "sql": "SELECT \n    backend_type,\n    count(*) \nFROM pg_stat_activity \nWHERE backend_type LIKE '%worker%'\nGROUP BY backend_type;\n\nSELECT \n    backend_type,\n    datname,\n    state,\n    count(*) AS count\nFROM pg_stat_activity\nWHERE backend_type IN (\n    'parallel worker', 'logical replication worker', 'autovacuum worker'\n)\nGROUP BY backend_type, datname, state;\n\n"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "Autovacuum Activity",
            "sql": "SELECT \n    pid,\n    relid::regclass AS table_name,\n    phase,\n    heap_blks_total,\n    heap_blks_scanned,\n    heap_blks_vacuumed\nFROM pg_stat_progress_vacuum;\n\nSELECT \n    schemaname,\n    relname,\n    last_autovacuum,\n    n_dead_tup\nFROM pg_stat_user_tables\nORDER BY last_autovacuum DESC NULLS LAST\nLIMIT 10;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "IO Timing",
            "sql": "SELECT \n    datname,\n    blk_read_time AS total_read_time_ms,\n    blk_write_time AS total_write_time_ms\nFROM pg_stat_database\nWHERE blk_read_time \u003e 0 OR blk_write_time \u003e 0;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "Cache Efficiency\n데이터 베이스별 캐시 효율 ",
            "sql": "SELECT \n    datname,\n    blks_hit,\n    blks_read,\n    ROUND(100 * blks_hit::numeric / NULLIF(blks_hit + blks_read, 0), 2) AS cache_hit_ratio\nFROM pg_stat_database;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": " Conflicts\n\nHot Standby 환경에서 주로 발생하는 리커버리 충돌 상황을 확인",
            "sql": "SELECT \n    datname,\n    confl_tablespace,\n    confl_lock,\n    confl_snapshot,\n    confl_bufferpin,\n    confl_deadlock\nFROM pg_stat_database_conflicts;"
        },
        {
            "name": "Instance Activity\nStats",
            "description": "Error \u0026 Failures",
            "sql": "SELECT\n    datname,\n    checksum_failures,\n    checksum_last_failure\nFROM pg_stat_database\nWHERE checksum_failures \u003e 0;"
        },
        {
            "name": "Instance Activity Stats - \nAbsolute Values",
            "description": "메모리 사용량 \n관련 통계",
            "sql": "SELECT \n    count(*) AS total_connections,\n    count(*) FILTER (WHERE state = 'active') AS active_connections,\n    count(*) FILTER (WHERE state = 'idle') AS idle_connections,\n    count(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_transaction,\n    pg_size_pretty(sum(CASE WHEN state = 'active' THEN (SELECT setting::bigint FROM pg_settings WHERE name = 'work_mem') ELSE 0 END)) AS estimated_active_work_mem\nFROM pg_stat_activity;"
        },
        {
            "name": "Instance Activity Stats - \nThread Activity",
            "description": "세션 및 커서\n 관련 통계",
            "sql": "SELECT\n    -- 백엔드 타입별 집계\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE backend_type = 'client backend') AS client_backends,\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE backend_type = 'background worker') AS background_workers,\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE backend_type = 'autovacuum worker') AS autovacuum_workers,\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE backend_type = 'logical replication launcher') AS logical_repl_launcher,\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE backend_type = 'parallel worker') AS parallel_workers,\n    \n    -- 상태별 집계\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'active') AS active_processes,\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'idle') AS idle_processes,\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'idle in transaction') AS idle_in_transaction,\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'fastpath function call') AS fastpath_function_calls,\n    \n    -- 대기 이벤트 분석\n    (SELECT COUNT(*) FROM pg_stat_activity WHERE wait_event IS NOT NULL) AS waiting_processes,\n    \n    -- 오래 실행 중인 쿼리\n    (SELECT COUNT(*) FROM pg_stat_activity \n     WHERE state = 'active' AND query_start \u003c NOW() - INTERVAL '5 minutes') AS long_running_queries,\n    \n    -- 실행 중인 쿼리 중 가장 오래된 쿼리의 지속 시간(초)\n    (SELECT COALESCE(EXTRACT(EPOCH FROM (NOW() - MIN(query_start))), 0)\n     FROM pg_stat_activity WHERE state = 'active') AS oldest_query_seconds,\n    \n    -- 총 프로세스 수\n    (SELECT COUNT(*) FROM pg_stat_activity) AS total_processes,\n    \n    -- DB 연결 정보\n    (SELECT COUNT(DISTINCT datname) FROM pg_stat_activity WHERE datname IS NOT NULL) AS connected_databases\nFROM\n    pg_catalog.pg_database\nLIMIT 1;"
        }
    ]
